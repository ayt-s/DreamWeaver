# ============================================================================
# 本地开发 profile（F4）
#
# 启用方式（任选其一）：
#   java -jar web-backend.jar --spring.profiles.active=dev
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
#   IDE 的 Active profiles 填 dev
#
# 为什么不放进主 application.yml：MyBatis 的 StdOutImpl 会把**每条 SQL** 打到
# stdout，常态/生产下会淹没真正的业务日志，也有额外开销。所以它只属于本地调试。
# ============================================================================

mybatis-plus:
  configuration:
    # 打印每条 SQL + 参数 + 结果行数，便于本地排查
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    # 本项目包下的日志放到 DEBUG（含自动重试器「为什么跳过某任务」的判定过程）
    com.dreamweaver: DEBUG
