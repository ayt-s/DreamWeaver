server:
  port: 8080

spring:
  application:
    name: dreamweaver-web-backend
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: jdbc:mysql://localhost:3306/dreamweaver?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    # ⚠️ 生产必须用 MYSQL_PASSWORD 覆盖，并轮换历史口令（旧口令曾以字面量提交进仓库）
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 刻意不开 log-impl：默认（no-logging）不打 SQL。
    # 生产/常态下每条 SQL 都打 stdout 会淹没真正的业务日志，也有开销。
    # 本地要看 SQL → 加 `--spring.profiles.active=dev`（见 application-dev.yml）。

dreamweaver:
  # ── 鉴权（阶段 2，2026-11-10）────────────────────────────────────────────
  auth:
    # JWT 签名密钥：生产必须显式设置（≥32 字符）；不设则每次启动生成随机密钥，
    # 表现为「重启后所有人被登出」，日志会警告。
    jwt-secret: ${JWT_SECRET:}
    jwt-expire-hours: ${JWT_EXPIRE_HOURS:72}
    # 首次启动创建 1 号账号（admin）时用的密码；不设则随机生成并打印到日志
    admin-init-password: ${ADMIN_INIT_PASSWORD:}
  # agent → Java 回调（/internal/**）的来源校验；不设则放行并警告（仅限本地开发）
  internal:
    token: ${INTERNAL_TOKEN:}
  # 允许跨域的前端来源（逗号分隔）；生产填真实域名
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  agent-service:
    # FastAPI 地址（模型侧）
    base-url: ${AGENT_SERVICE_URL:http://127.0.0.1:8000}
  agnes:
    # 仅服务端转发的场景才需要；Phase 1 视频提交直接走 FastAPI，此 Key 仅预留
    api-key: ${AGNES_API_KEY:}
  quota:
    # 默认单镜时长（秒），回调未携带 shot_seconds 时使用
    default-shot-seconds: 5
    # 管理员列表（逗号分隔的 userId）
    admins: ${QUOTA_ADMINS:}

app:
  upload-dir: ./uploads
  retry:
    enabled: true
    interval-ms: 60000
    min-age-seconds: 180
    # ⚠️ 这里原先写的是 `max-attempts: 3` —— **那个键从来没被读过**。
    # TaskAutoRetryer 实际读的是下面两个按类型区分的键，缺失时用**代码默认值**：
    #   max-video-attempts 默认 1（视频贵且慢，只给 1 次）
    #   max-image-attempts 默认 3
    # 所以旧配置会让人以为「视频会重试 3 次」，实际只重试 1 次。现显式写出两个键，
    # 配置即真相，不再依赖代码里的默认值（默认值改了配置看不出差异，也是隐患）。
    max-video-attempts: 1
    max-image-attempts: 3
    video-spacing-seconds: 90
    image-spacing-seconds: 30
    max-video-per-sweep: 1
    max-image-per-sweep: 2

# 健康检查（compose healthcheck / 监控探针用）
# 只暴露 health/info：actuator 的其它端点会泄漏内部信息，不给公网开
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
