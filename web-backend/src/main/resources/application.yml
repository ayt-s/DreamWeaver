server:
  port: 8080

spring:
  application:
    name: dreamweaver-web-backend
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: jdbc:mysql://localhost:3306/dreamweaver?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

dreamweaver:
  agent-service:
    # FastAPI 地址（模型侧）
    base-url: ${AGENT_SERVICE_URL:http://127.0.0.1:8000}
  agnes:
    # 仅服务端转发的场景才需要；Phase 1 视频提交直接走 FastAPI，此 Key 仅预留
    api-key: ${AGNES_API_KEY:}
  quota:
    # 默认单镜时长（秒），回调未携带 shot_seconds 时使用
    default-shot-seconds: 5
    # 管理员列表（逗号分隔的 userId）
    admins: ${QUOTA_ADMINS:}

app:
  upload-dir: ./uploads
  retry:
    enabled: true
    interval-ms: 60000
    min-age-seconds: 180
    max-attempts: 3
    video-spacing-seconds: 90
    image-spacing-seconds: 30
    max-video-per-sweep: 1
    max-image-per-sweep: 2
