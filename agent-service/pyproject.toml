[project]
name = "dreamweaver-agent"
version = "0.1.0"
description = "DreamWeaver AI 短视频创作 Agent — FastAPI 模型侧"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "langgraph>=0.2.50",
    "opencv-python-headless>=4.8",
    "imageio-ffmpeg>=0.5",
    "pydantic-ai-slim>=2.39",
    "openai>=1.40",
    # 会话持久化（显式 Redis 快照 + 启动恢复，见 app/session_store.py）
    "redis>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "real_gateway_method: 故意调用真实 Agnes 网关方法（测试自备假 HTTP 客户端，不出网）",
]